[package]
name = "dsp-rs"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.89"
axum = { version = "0.8.3", features = ["ws"] }
chrono = "0.4.44"
futures = "0.3.32"
http-body-util = "0.1.3"
jsonschema = { version = "0.29.1", default-features = false, features = ["resolve-file"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
reqwest-websocket = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
tokio = { version = "1.44.1", features = ["fs", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.14", features = ["rt"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5" }
uuid = { version = "1.16.0", features = ["v4"] }

base64 = { version = "0.23", optional = true }
p256 = { version = "0.14.0", optional = true }
rand = { version = "0.10.2", optional = true }

[features]
default = ["echo"]
tck = []
echo = ["dep:base64"]
keygen = ["dep:base64", "dep:p256", "dep:rand"]

[[bin]]
name = "keygen"
path = "src/tools/keygen.rs"

